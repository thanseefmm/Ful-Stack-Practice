<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table tag</title>
</head>
<body>
 <h1><center> <u>Table tag</u> </center></h1>
 <h2> <u>Colspan</u> </h2>
 <table border="1" cellpadding="10px" cellspacing="0px">
    <thead>
        <tr>
            <th colspan="2">Title</th>
        </tr>
        <tr>
            <th>subtitle</th>
            <th>subtitle</th>
        </tr>
    </thead>
    <tbody>
        <tr>
         <td>1 item 123</td>
         <td>2 item 123</td>
        </tr>
         <tr>
         <td>1 item 123</td>
         <td>2 item 123</td>
        </tr>
         <tr>
         <td>1 item 123</td>
         <td>2 item 123</td>
        </tr>
    </tbody>
    <thead>

        <tr>
            <th>subtitle</th>
            <th>subtitle</th>
        </tr>
 </table> 


 <h2> <U>Rowspan Tag</U></h2>
 <table border="1px" cellpadding="10px" cellspacing="0px">
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Subject</th>
            <th>Marks</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td rowspan="3">1</td>
            <td rowspan="3">David</td>
            <td>Math</td>
            <td>80</td>
        </tr>
        <tr>
            <td>Physics</td>
            <td>90</td>
        </tr>
        <tr>
            <td>Computer </td>
            <td>70</td>
        <tr>
            <td rowspan="3">2</td>
            <td rowspan="3">Alex</td>
            <td>Math</td>
            <td>80</td>
        </tr>
        <tr>
            <td>Physics</td>
            <td>70</td>
        </tr>
        <tr>
            <td>Computer </td>
            <td>90</td>
        </tr>
 </table>
</body>
</html>
