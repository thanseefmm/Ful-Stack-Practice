<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <h1><center> <u>Form</u> </center></h1>
    <form action="" method="post" align="center">
        <h1>Send an inquiry</h1>
        <P><input type="text" name="user-name" placeholder="Full Name" size="40"></P>
        <p><input type="email" name="user-email" placeholder="Work Email" size="40"></p>
        <textarea name="comments" id="" placeholder="How can we help you?" cols="40" rows="5"></textarea><br>
        <input type="submit" value="Submit Request" size="40">

    </form><br><hr>

                  <!---------------------- -->
                  <!-- Student Information -->
                  <!------------------------->


     <h1><center>Student Application</center></h1>
     <from action="" method="" align="center">

        <fieldset>
            
        <legend><h2>Personal Information</h2></legend>

        <P> <label for="Name">Name:</label> <br>
            <input type="text" id="Name" name="Name" placeholder="enter your name" size="40"></P>

        <P><label for="Email">Email:</label><br> 
            <input type="email" id="Email" name="Email" placeholder="enter your email" size="40"></P>

        <p><label for="DOB">Date of birth:</label><br>
            <input type="date" id="DOB" name="DOB"></p>
        </fieldset>
         
        <fieldset>
            <legend> <h2>Extra Information</h2></legend>

        <P><label for="certificate">certificate:</label> <input type="file" id="certificate" name="certificate"></P>    

        <P><label for="Address">Address:</label><br>
            <textarea name="Address" id="Address" cols="40" rows="5"></textarea></P>
         
        <P><label for="Gender">Gender:</label><br>
               <input type="radio" id="male" name="Gender" value="male" checked="checked"> <label for="male">Male</label>
               <input type="radio" id="female" name="Gender" value="female" checked="checked"> <label for="female">Female</label></P> 

        </fieldset>

       <fieldset>
         <legend><h2>Course Information</h2></legend>

        <p><label for="Course">Course:</label><br>
            <input type="checkbox" id="web-engineering" name="web engneering"> <label for="web-engineering">Web Engineering</label><br>
            <input type="checkbox" id="software-engineering" name="software engneering"> <label for="software-engineering">Software Engineering</label><br>
            <input type="checkbox" id="ai" name="AI"> <label for="ai">Artificial Intelligence</label><br>
            <input type="checkbox" id="cs" name="CS"> <label for="cs">Cyber security</label><br>
            
  
        </p> 
        <p><input type="submit" value="submit"></p>         

       </fieldset>

     </from>

</body>
</html>
